<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon aponta pro símbolo da marca em public/brand/.
         Quando você trocar a logo, basta substituir o arquivo lá — o
         favicon atualiza junto sem mexer aqui. -->
    <link rel="icon" type="image/png" href="/brand/vortice-symbol.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: o ícone instalado na tela inicial vem do manifest (Android) e do
         apple-touch-icon (iOS) — ambos gerados a partir do favicon.svg da marca. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vórtice" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F1E" />
    <title>Vórtice — Gestão de Campanha 2026</title>

    <!-- ====================================================================
         Open Graph + Twitter Card
         Controla o preview quando o link é compartilhado em WhatsApp,
         Telegram, Slack, Twitter, etc. Sem essas tags, o scrapper desses
         apps cai no favicon (que é pequeno e quadrado) e renderiza corte
         feio (vide screenshot do WhatsApp em 2026-06-08).

         og:image precisa ter URL ABSOLUTA — caminhos relativos não são
         seguidos por alguns crawlers (especialmente o do WhatsApp). A URL
         abaixo aponta pro deploy de produção do Railway; se mudar o
         hostname, ATUALIZAR aqui também.

         Usamos `vortice-og-1200.png` (1200x1200, fundo #0A1628 com logo
         centralizada) — gerada via script Python em 2026-06-08 a partir do
         `vortice-symbol.png` original (202x227, pequeno demais pra preview).
         Caso queira layout horizontal pra Twitter/Facebook, gerar uma versão
         1200x630 e trocar pra `twitter:card = summary_large_image`.
         ==================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vórtice" />
    <meta property="og:title" content="Vórtice — Gestão de Campanha 2026" />
    <meta
      property="og:description"
      content="Plataforma de inteligência política para campanhas eleitorais 2026."
    />
    <meta
      property="og:image"
      content="https://vorticepol-tica2026-production.up.railway.app/brand/vortice-og-1200.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Logo Vórtice" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter usa cards próprios. summary = preview quadrado (combina com
         a marca); summary_large_image seria pra imagem 1200x630 horizontal. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vórtice — Gestão de Campanha 2026" />
    <meta
      name="twitter:description"
      content="Plataforma de inteligência política para campanhas eleitorais 2026."
    />
    <meta
      name="twitter:image"
      content="https://vorticepol-tica2026-production.up.railway.app/brand/vortice-og-1200.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
